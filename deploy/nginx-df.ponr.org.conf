# Nginx 站点配置 —— df.ponr.org 反向代理到本项目 (127.0.0.1:3020)
# 只新增这一个 server 块，不改动其他项目的配置。
#
# 安装：
#   sudo cp deploy/nginx-df.ponr.org.conf /etc/nginx/sites-available/df.ponr.org.conf
#   sudo ln -s /etc/nginx/sites-available/df.ponr.org.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 证书（Let's Encrypt）：
#   sudo certbot --nginx -d df.ponr.org
#   certbot 会自动补全下面的 443 / SSL 配置并加一段 80->443 跳转。

server {
    listen 80;
    listen [::]:80;
    server_name df.ponr.org;

    # 付款截图上传上限 5MB，给点余量
    client_max_body_size 8m;

    # 访问日志单独放，方便排查（不与其他站点混）
    access_log /var/log/nginx/df.ponr.org.access.log;
    error_log  /var/log/nginx/df.ponr.org.error.log;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
